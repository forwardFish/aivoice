project:
  name: aivoice
  root: D:\lyh\agent\agent-frame\aivoice

docs:
  requirements:
    - "D:\lyh\agent\agent-frame\aivoice\docs\cloudbase-production-refactor-requirements.md"
  ui: []
lanes:
  intake:
    enabled: true
  requirements:
    enabled: true
  stories:
    enabled: true
  frontend:
    enabled: true
  backend:
    enabled: true
  contract:
    enabled: true
  visual:
    enabled: false
  integration:
    enabled: true
  reportIntegrity:
    enabled: true
  secretGuard:
    enabled: true

commands:
  install: "npm install"
  lint: ""
  typecheck: "npm run typecheck"
  test: "npm test"
  build: "npm run build"
  smoke: "node scripts/acceptance/cloudbase-public-api-smoke.mjs"
  acceptance: "npm run typecheck"
  uiStart: ""
  uiBaseUrl: "http://127.0.0.1:3000"
  frontendTest: "npm run typecheck:miniprogram && npm run test:miniprogram"
  backendTest: "powershell -NoProfile -ExecutionPolicy Bypass -File .\\scripts\\local\\run-backend-gates.ps1"
  e2e: "node scripts/acceptance/cloudbase-runtime-smoke.mjs; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; node scripts/acceptance/cloudbase-payment-rpc-smoke.mjs"
  apiSmoke: "node scripts/acceptance/cloudbase-public-api-smoke.mjs"
  uiCapture: ""
  uiCompare: ""

verifierDependencies:
  allowInstallDevDependencies: false
  allowEphemeralNpx: true
  installPlaywrightBrowsers: false
  packages:
    - "playwright"
    - "pixelmatch"
    - "pngjs"

visual:
  diffThreshold: 0.03
  allowPassWithLimitation: true
  requireScreenshotForP0: true
  requireDesktopScreenshot: true
  requireMobileScreenshot: true
  allowManualReviewWhenNoBrowser: true

uiMapping: []

resumable:
  enabled: true
  handoffFile: docs/auto-execute/latest/HANDOFF.md
  latestDir: docs/auto-execute/latest
  resumeCommand: powershell -ExecutionPolicy Bypass -File .\scripts\acceptance\resume-convergence.ps1
  prohibitResetOnResume: true
  updateHandoffAfterEachLane: true

supervisor:
  enabled: false
  mode: codex-exec
  maxWorkerRounds: 20
  taskFile: TODO.md
  logDir: .codex-runs
  askForApproval: never
  sandbox: workspace-write
  oneTaskPerWorker: true
  updateHandoffEveryRound: true
  stopOnBlocked: true

safety:
  allowCommit: false
  allowPush: false
  allowDeploy: false
  allowProductionDb: false
  allowPayment: false

convergence:
  maxRepairRounds: 5
  requireFinalGate: true
  requireEvidenceForPass: true
  requirePrdSectionCoverage: true
  requireStoryVerification: true
  requireUiScreenshots: false
  requireContractVerification: true
